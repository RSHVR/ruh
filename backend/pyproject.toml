[project]
name = "ruh-backend"
version = "0.1.0"
description = "AI-powered product safety analysis backend"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "anthropic>=0.85.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "psycopg[binary]>=3.2.0",
    "redis>=5.2.0",
    "celery>=5.4.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.3.0",
    "supabase>=2.0.0",
    "slowapi>=0.1.9",
    "tavily-python>=0.5.0",
    "trafilatura>=1.12.0",
    "playwright>=1.49.0",
    # LangGraph + Cohere/Anthropic for ReACT and StateGraph agents.
    # langgraph bumped to 1.x for the new StateGraph API used by the
    # benchmark suite (existing langgraph_agent.py uses create_react_agent
    # which remains stable in v1).
    "langchain>=0.3.0",
    "langchain-cohere>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "langgraph>=1.0.0",
    # Direct Cohere SDK for the cohere_asyncv2_cached config.
    "cohere>=5.13.0",
    # Anthropic agent SDK for the claude_agentsdk_async_cached config.
    "claude-agent-sdk>=0.1.0",
]

[project.optional-dependencies]
benchmark = [
    "plotly>=5.24.0",
    "scipy>=1.14.0",
    "nest-asyncio>=1.6.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "black>=24.10.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["setuptools>=75.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 100
target-version = ['py313']

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
