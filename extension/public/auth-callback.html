<!DOCTYPE html>
<html>
<head>
  <title>Ruh - Signing in...</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #faf8f5;
      color: #3d3529;
    }
    .container {
      text-align: center;
      padding: 2rem;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #e8e0d4;
      border-top-color: #8b7355;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error { color: #c53030; margin-top: 1rem; }
  </style>
</head>
<body>
  <div class="container">
    <div class="spinner"></div>
    <p id="status">Completing sign in...</p>
    <p id="error" class="error" style="display:none"></p>
  </div>
  <script>
    // Extract tokens from the URL hash after Supabase OAuth redirect.
    // Send them to the background worker which will call supabase.auth.setSession().
    (async function() {
      try {
        const hashParams = new URLSearchParams(window.location.hash.substring(1));
        const accessToken = hashParams.get('access_token');
        const refreshToken = hashParams.get('refresh_token');

        if (!accessToken || !refreshToken) {
          // Maybe PKCE flow — check for code in query params
          const queryParams = new URLSearchParams(window.location.search);
          const code = queryParams.get('code');

          if (code) {
            // Send the auth code to background worker for PKCE exchange
            const response = await chrome.runtime.sendMessage({
              type: 'AUTH_CALLBACK',
              code: code,
            });

            if (response?.success) {
              document.getElementById('status').textContent = 'Signed in! Closing...';
              setTimeout(() => window.close(), 1000);
            } else {
              throw new Error(response?.error || 'Failed to exchange auth code');
            }
          } else {
            throw new Error('No tokens or auth code found in redirect URL');
          }
          return;
        }

        // Implicit flow — send tokens directly
        const response = await chrome.runtime.sendMessage({
          type: 'AUTH_CALLBACK',
          access_token: accessToken,
          refresh_token: refreshToken,
        });

        if (response?.success) {
          document.getElementById('status').textContent = 'Signed in! Closing...';
          setTimeout(() => window.close(), 1000);
        } else {
          throw new Error(response?.error || 'Failed to set session');
        }
      } catch (err) {
        document.getElementById('status').textContent = 'Sign in failed';
        const errorEl = document.getElementById('error');
        errorEl.textContent = err.message;
        errorEl.style.display = 'block';
        // Auto-close after showing error
        setTimeout(() => window.close(), 5000);
      }
    })();
  </script>
</body>
</html>
